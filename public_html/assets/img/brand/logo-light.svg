    Redrawn approximation of the Cosy Inn mark: pitched roof, window, palm.
    REPLACE THIS with the original vector logo from whoever designed the
    signage and the menu flyer. This is a stand-in, not the real artwork.
  -->
  <g fill="none" stroke="#dcbc7d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
